name: Build and Upload Test Artifact

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: Build type
        options:
          - Stable
          - Experimental

run-name: "${{ github.event_name == 'pull_request' && 'Pull Request Build, DO NOT DOWNLOAD' || format('{0}#{1}: {2}', github.ref_name, github.run_number, github.event.commits[0].message)}}"

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

      # add more feat here if required
      - name: Gather build info
        id: vars
        run: |
          BRANCH_FEAT=$(echo "${{ steps.branch-names.outputs.current_branch }}" | cut -d'/' -f1 | awk '{print tolower($0)}')
          if [ "$BRANCH_FEAT" = "experimental" ]; then
            echo "BUILD_TYPE=Experimental" >> $GITHUB_OUTPUT
          else
            echo "BUILD_TYPE=Stable" >> $GITHUB_OUTPUT
          fi

      - name: Fix Gradle permission
        run: chmod +x ./gradlew

      # === 临时修复：为 GenerateBinPatches 任务的 side 属性注入默认值 ===
      # 解决 Gradle 版本升级后 side 属性未配置导致构建中断的问题
      - name: Fix side property for GenerateBinPatches
        run: |
          # 在根目录 build.gradle 中注入默认配置
          if [ -f "build.gradle" ]; then
            echo '' >> build.gradle
            echo '// Temporary fix: set default side for GenerateBinPatches' >> build.gradle
            echo 'tasks.withType(net.minecraftforge.gradle.patcher.tasks.GenerateBinPatches).configureEach {' >> build.gradle
            echo '    side.convention("CLIENT")' >> build.gradle
            echo '}' >> build.gradle
            echo "[INFO] Injected side convention fix into build.gradle"
          fi
          # 在 cleanroom 子项目中同样注入
          if [ -f "projects/cleanroom/build.gradle" ]; then
            echo '' >> projects/cleanroom/build.gradle
            echo '// Temporary fix: set default side for GenerateBinPatches' >> projects/cleanroom/build.gradle
            echo 'tasks.withType(net.minecraftforge.gradle.patcher.tasks.GenerateBinPatches).configureEach {' >> projects/cleanroom/build.gradle
            echo '    side.convention("CLIENT")' >> projects/cleanroom/build.gradle
            echo '}' >> projects/cleanroom/build.gradle
            echo "[INFO] Injected side convention fix into projects/cleanroom/build.gradle"
          fi
          echo "[INFO] Side property fix applied successfully"

      - name: Setup Forge env
        run: ./gradlew setup -Prun_number=${{ github.run_number }}
      - name: Stop Gradle daemon
        run: ./gradlew --stop

      - name: Build Jars
        run: ./gradlew installerJar -Prun_number=${{ github.run_number }}

      - name: Get version
        run: echo "CLEANROOM_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Upload Forge Universal
        uses: actions/upload-artifact@v4.3.3
        with:
          name: universal-${{ env.CLEANROOM_VERSION }}
          path: projects/cleanroom/build/libs/*-universal.jar

      - name: Upload Forge Installer
        id: upload-job
        uses: actions/upload-artifact@v4.3.3
        with:
          name: installer-${{ env.CLEANROOM_VERSION }}
          path: projects/cleanroom/build/libs/*-installer.jar
          if-no-files-found: error

#      - name: Repository Dispatch
